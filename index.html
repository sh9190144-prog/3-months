ng something... Like tumhe vo cheez, out of responsibility krni pd rhi", "platform": "instagram", "seq": null}, {"ts": "2026-08-15T00:05:00", "sender": "chinmayi", "text": "29Kis sphere me?Over thinking... Ek limit tak achhi hoti..  tu use bhi cross ke deta😭Umm... Ji vo jis naam ki aapki id hSupport system...Orchestral... Vo octa krke h kya?Me.. kidding... SuryanshBhyi, hell naw...Not sure..Behror rn...", "platform": "instagram", "seq": null}, {"ts": "2026-08-15T00:15:00", "sender": "shivraj", "text": "sooo there are 2 guyz , one is vini junior , i support him coz he's in my fav club and bohot badhiya player hai and other is rodri , spain ka playe hai , merko ni pasnad", "platform": "instagram", "seq": null}, {"ts": "2026-08-15T23:32:00", "sender": "shivraj", "text": "1-udhar accha khaana nahi milta2-you can't kill anyone litreally3-udhar sleeping schedule fixed hota4-harsh enviornmental conditions5-you cant follow orders(acchi baat hai )", "platform": "instagram", "seq": null}, {"ts": null, "seq": 281, "sender": "chinmayi", "text": "5th time...\nBut no regrets...\nSooo... mujheeee Esa lag rha he this shit is going wayyyyy too one sided.... like its just you who asks me if I'm okay or not...\nAll the pampering is from your sideee onlyyy....\nI feel like I ain't giving my all... like you deserve more...\nBreakup nahi kr rhi hu, rone na lag jaana...\n..\nSo... that #waited_for_1.5_hour wala msg you sent me?\nVo padhke, I genuinely felt my heart drop...", "platform": "pinterest"}, {"ts": null, "seq": 282, "sender": "chinmayi", "text": "That text made me realise, how I awaited you, and that literally fekt like ghosting...\nMekkooo sahi batau, to gussa aa rha tha.., tujhpe, aur usse bhi zyada khudpe...\nTepe isiliye because, WHY the hell do you care for me sooo much... WHY the pampering, why tune apni schedule ki baap-bhai kr rkhi, just because of me...\nLike, meko gussa aata he, idk why, When someone slows the slight affection... like why are you getting pareshan because of me", "platform": "pinterest"}, {"ts": null, "seq": 283, "sender": "chinmayi", "text": "I literally do NOT like the fact that someone is making an effort... matlab pata nahi kya dimaag me kharaabi he mere... I just don't know...\nLike kisi point le teko bhi laga hoga na, ki Chinmayi should've been available a lil more... like genuinely batanaa", "platform": "pinterest"}, {"ts": null, "seq": 284, "sender": "chinmayi", "text": "Aur khudpe isiliye gussa aa rha, because, that was because of me... maybe, if my household was a lil more radical, I would've given you my time more...", "platform": "pinterest"}, {"ts": null, "seq": 296, "sender": "shivraj", "text": "see idk why you blame yourselves for not coming online because your father is sitting beside you etc . I know and i understand and i have no freakin problem with it", "platform": "pinterest"}, {"ts": null, "seq": 298, "sender": "shivraj", "text": "Miss Chinmayi....\n\nSabse pehle toh thank you ki tune ye sab mujhe honestly bata diya. Aur sach bolu, ye padhke mujhe bilkul bhi ye feel nahi hua ki tu kam kar rahi hai ya mujhe jitna deserve hai utna nahi de rahi.\n\nHaan, main pooch leta hu baar baar ki tu theek hai ya nahi, main wait kar leta hu tere messages ka, main zyada express kar deta hu... par vo isliye nahi kyunki mujhe lagta hai ki mujhe uska return chahiye. Main karta hu kyunki mujhe teri fikr hai, mujhe tu important lagti hai, aur mujhe accha lagta hai tujhe pamper karna.", "platform": "pinterest"}, {"ts": null, "seq": 300, "sender": "shivraj", "text": "Aur waise, ye jo \"breakup nahi kar rhi hu, rone na lag jaana\" tha na... kasam se us line se pehle tak meri toh hawa hi nikal gayi thi. Maine socha bas, aaj toh gaya main. \n\nIsliye please ye mat soch ki tu mujhe deserve se kam de rahi hai. Mujhe koi perfect balance sheet nahi chahiye jahan dono exactly same amount me effort dikhayein. Mujhe bas tu chahiye. Tera hona hi mere liye kaafi zyada hai.", "platform": "pinterest"}, {"ts": null, "seq": 301, "sender": "shivraj", "text": "Aur ek baat bataun? Jo insaan itna soch raha ho ki \"main enough de rahi hu ya nahi\", vo kabhi careless ho hi nahi sakta. Agar tujhe farak nahi padta hota na, toh tu ye conversation hi nahi karti. Tu itna feel hi nahi karti.", "platform": "pinterest"}, {"ts": null, "seq": 470, "sender": "chinmayi", "text": "Ek baar extra class thi \nHam 4-5 Bande ruk gye, 2 ghante ke liye...\nAur uska banda, adv ki taiyaari kr rha, to vo school aa rha tha, 12th exams hone ke baad bhi", "platform": "pinterest"}, {"ts": null, "seq": 474, "sender": "chinmayi", "text": "To, jab ham ghar jaane lage, to Sandeep sir(Chem, jo le rhe the class) vo tab dhoondh rhe the apna... utni der me maahi, bhaiya se just milne gayi thi, like shkal vgerh dikh jaye", "platform": "pinterest"}, {"ts": null, "seq": 475, "sender": "chinmayi", "text": "Bhaiya ne, uska ek haath pakda, like jaha pe camera me naa aye, board ke peechhe, and then, unka mwah ho gya... lips pe vo bhi🙂\nMatlab fraction of seconds ke liye tha\nBut it still counts as both of their 1st kiss..,", "platform": "pinterest"}, {"ts": null, "seq": 766, "sender": "shivraj", "text": "aaj subah jab mein auto mein tha na , tera status dekha , to vo acche se load nahi hua , merko laga vo 1 hi pic hai , abhi shyam ko mammi bata rahi phone check karke ki voh vid hai", "platform": "pinterest"}, {"ts": null, "seq": 1048, "sender": "shivraj", "text": "heyy... agar abhi batana nahi chahti toh bilkul mat bata, no pressure \n\nbas itna yaad rakhna ki jo bhi hua hai, tujhe usse akela deal nahi karna padega. kabhi bhi lage ki mann heavy ho raha hai, ya bas chup rehna hai aur koi saath chahiye, i'm here.\n\naur haan, aaj ke liye meri ek hi advice hai — khud pe thoda gentle reh. har cheez ka answer ya solution aaj hi milna zaroori nahi hota.\n\ntake care of yourself, okay? ✨  \naur please zyada sochna mat... meri cutie ko udaas rehna suit nahi karta.", "platform": "pinterest"}, {"ts": null, "seq": 1172, "sender": "shivraj", "text": " yunki woh ek date hai, main usse isliye sochta hoon kyunki woh tumhari date hai", "platform": "pinterest"}, {"ts": null, "seq": 1458, "sender": "shivraj", "text": "Aur agar tum hi nahi rahogi meri life mein, toh phir shayad kisi aur date ko apne upar likhne ka mann hi nahi karega. Ye tattoo wali baat shayad chhoti lage, par mere liye ye bas tattoo ki baat nahi hai, ye uss darr ki baat hai ki kahin main uss insaan ko na kho doon jiske aane ke baad meri saari future wali soch badal gayi.", "platform": "pinterest"}, {"ts": null, "seq": 1596, "sender": "chinmayi", "text": "To vo kehte\n\"Ye pink colour ka, gulaab flavour he\"\n\"Ye blue colour ka, raspberry flavour he\"\n\"Ye orange colour ka, narangi flavour he\"\n\"Ye brown wala kala khatta\"", "platform": "pinterest"}, {"ts": null, "seq": 1610, "sender": "chinmayi", "text": "Like, genuinely, love youuu...\nMtlb mere saath bhi Esa ho gya he, ki kuchh bhi hota he, koi daant ta he, ya kuchh bura lagta he, Esa lagta sab terepe aake jhaad du... Matlab sbbbb bata dungi, as if batane se shi ho jata sb kuchh...", "platform": "pinterest"}, {"ts": null, "seq": 1757, "sender": "shivraj", "text": "kal subah 4 baje mene happy fathers day wish kiya papa ko , mammi bolti hug karo , we both were like hell naw , then karna hi pada obv , usi mein hi unhone merko upar tak lift kar liya]", "platform": "pinterest"}, {"ts": null, "seq": 2680, "sender": "chinmayi", "text": "Vo bhi saah me hi the baat ke time\nMummy ka zgada tha man, to papa ne araam se hi ouchha tha, chalega? \nAb meko nahi osnd tantrums phekne phaltu ke...\nTo mene keh diya tha, thik h.,.", "platform": "pinterest"}, {"ts": null, "seq": 2715, "sender": "shivraj", "text": "Yaar, honestly, mujhe nahi lagta ki aunty ka matlab ye tha ki tum enough nahi ho. Lekin phir bhi, jo tumne feel kiya na, woh bilkul valid hai.\n\nTumne bachpan se logon ko ye bolte suna hai ki \"ek ladka bhi hona chahiye\", aur har baar tumhare andar shayad ye feeling aayi hogi ki \"main hoon na, main sab heez nahi ho. Tum unki beti ho, unki family ho, aur woh cheez kisi aur ke aane se kam nahi ho jaati.\n\nAur meri nazar mein? Tum kabhi \"not enough\" nahi thi. Ek second ke liye bhi nahi.", "platform": "pinterest"}, {"ts": null, "seq": 2719, "sender": "shivraj", "text": "Honestly, mujhe lagta hai tujhe bura lagna bilkul natural hai. Shayad kisi aur ko ye ek normal baat lage, par tere liye ye sirf ek sentence nahi tha. Saalon se jab bhi log bolte the ki \"ek ladka hona chahiye\", tab tu hamesha apne parents ke liye stand leti thi, ye soch ke ki \"main hoon na.\" Tu un logon mein se nahi thi jo sirf beti hone ki baat karti hain, tu genuinely believe karti thi ki tu apne parents ke liye utna hi kar sakti hai jitna koi beta karta. Isliye jab aunty ne \"jis cheez ki kami hai, use poora kar sakte hain\" bola, to obviously dil ko lagega hi. Chahe unka intention galat na ho, par us moment mein aisa feel hona ki shayad tujhe us kami ka hissa samjha ja raha hai, bahut painful hai. Aur sabse buri baat ye hai ki ye baat kisi random insaan ne nahi, teri mom ne boli, jinki opinion tere liye matter karti hai.", "platform": "pinterest"}, {"ts": null, "seq": 2720, "sender": "shivraj", "text": "Mujhe lagta hai tu overreact nahi kar rahi. Tu bas hurt hui hai. Kyunki jab tu itne saalon se prove karne ki koshish kar rahi ho ki tu enough hai, aur phir ek line aise sunne ko mile jo us belief ko shake kar de, to dard hona obvious hai. Aur honestly, mujhe thoda unfair bhi lagta hai ki society pehle ladkiyon ko ye feel karwati hai ki unhe khud ko prove karna padega, aur phir jab woh poori jaan laga deti hain, tab bhi \"kami\" wali baatein sunni padti hain. Tu koi replacement nahi hai kisi cheez ka, aur na hi tujhe kisi \"missing son\" ke scale par measure kiya jana chahiye. Tu bas tu hai, aur itna hi kaafi hona chahiye tha.", "platform": "pinterest"}, {"ts": null, "seq": 2721, "sender": "shivraj", "text": "Isliye please apne aap ko ye mat bol ki \"shayad main zyada soch rahi hoon.\" Nahi. Te uchh hua, to I don't want to loose that sense of comfort ever...", "platform": "pinterest"}, {"ts": null, "seq": 9563, "sender": "chinmayi", "text": "Like, abhi, mere pov se, it's gonna take time (idk why) to like give you all of my heart. It is fs. Kyunki, its like my 1st time, and I dont even know what to do, When to do, how to do and all... and like I do love you for all of you... but you ended up giving me all of yours and I'm afraid to be reason if that ever breaks,.. sahi me. That shit haunts me. Kyunki, tu bohot pure he, bohottttt zyada, and knowing your history about Kajal, I feel like, If I too break your heart or whatever, tu kaafi detach ho jaane wala he cheezo se...\nMatlab yawr, that feels illegal,(If) me having feelings for someone else when you are by side.., matlab , you care for me always, look out for me and bhyi... care yawr... you fucking care.", "platform": "pinterest"}, {"ts": null, "seq": 9564, "sender": "chinmayi", "text": "Shuru shuru me, Dev, tha. To mere dimaag me chalta rehta tha, ki I am doing wrong, I am doing wrong... like, abhi break le leti hu, dev ko hata dungi, and then wapis patch up karlenge.\nBut I feel like, agar Esa kuchh kiya hota, to baat same nahi rehti. Like, aage bhi Esa kuchh hua, to me yahi sochingi, like 1st thought, ki thoda break le lete, kyunki bhyi, that shit feels soo stinging, ki I a, in relationship with such a pure hearted guy, and still crushing over someone else...\nBut, Esa karne pe, tere mind me bhi thoughts rahenge, ki ahi to ek baar hua he. Aage pata nahi aur kitni baar hoga, aur kitni baar break heal karte rahenge.", "platform": "pinterest"}, {"ts": null, "seq": 9565, "sender": "chinmayi", "text": "Itna meko pata he ki terese xyada loyal to nahi milega meko.\nBut I am afraid of mysekf. Like self doubt and all, ki I will crush over someone else, and break you internally.\nAbhi Esa kuchh nahi hone wala he. Sochiyo mat zyaadaaa. Plisssssssss\nSo. Yeah.\nIt scares me. The idea of leaving you. And the thought of your tears.\nMatlab Esa kuchh ho gya toh.... kya hoga....\nTo bataiyega. Every single, every tiny detail.", "platform": "pinterest"}, {"ts": null, "seq": 9841, "sender": "shivraj", "text": "Miss Chinmayi...\nSabse pehle ek baat. Thank you. Itna sab kuch jo tune likha na, uske liye bohot himmat chahiye hoti hai. Log usually apne dar chhupa lete hain, ya jhooth bol dete hain ki \"aisa kabhi hoga hi nahi.\" Tu aisa nahi kar rahi. Tu apna sabse ugly fear bhi mere saamne rakh rahi hai. Aur mere liye ye kisi bhi \"I love you\" se kam nahi hai. Kyunki love sirf achhe moments me nahi dikhta. Love tab dikhta hai jab insaan apne andar ke thoughts bhi kisi pe trust karke rakh de.\nAur ab meri baat dhyaan se sun.", "platform": "pinterest"}, {"ts": null, "seq": 9842, "sender": "shivraj", "text": "Agar kabhi future me tujhe kisi aur ke liye feelings develop ho bhi jaati hain... to obviously dard hoga. Bohot hoga. Main koi superhero nahi hoon jo bolega \"haan koi baat nahi.\" Nahi. Main tootunga. Main royunga. Shayad khud pe sawal bhi uthaoonga. Shayad kuch din tak har chhoti baat yaad aayegi. Tera \"bro\" bolna, tera bully karna, tera randomly baby bol dena, tera goodnight kehna... sab. Har memory mere dimaag me baar baar chalegi. Aur haan, Kajal ke saath , I was't even comfortable, nor did i enjoy her company. Ye sach hai. Main jhooth bolke strong banne ki acting nahi karunga.\nLekin ek aur sach hai.", "platform": "pinterest"}, {"ts": null, "seq": 9843, "sender": "shivraj", "text": "Mujhe sabse zyada kis cheez se dard hoga pata hai? Agar tu chup rahe. Agar tu sirf isliye acting kare ki main hurt na ho jaun. Agar tu mujhe pyaar ka jhootha version deti rahe jab tera dil kahin aur jaa raha ho. Woh mujhe tod dega. Sach kabhi itna nahi todta jitna jhooth todta hai.\nTu bol rahi hai na ki \"I am afraid of myself.\"\nMain tujhe ek cheez bataun?", "platform": "pinterest"}, {"ts": null, "seq": 9844, "sender": "shivraj", "text": "Feelings koi switch nahi hoti. Kisi pe thoda sa crush ho jaana aur kisi se pyaar karna dono same cheez nahi hote. Hum sab humans hain. Kabhi kabhi koi attractive lag sakta hai. Kisi ki personality achhi lag sakti hai. Kisi ke saath baat karna interesting lag sakta hai. Lekin relationship is about the choices we make after those feelings. Pyaar har roz choose kiya jaata hai. Aur mujhe lagta hai tu already woh choice kar rahi hai. Kyunki agar tujhe meri parwah na hoti, to tu itna lamba message likh ke khud ro nahi rahi hoti. Tu simply ignore kar deti. Guilt sirf us insaan ko hota hai jisko saamne wale ki value hoti hai.\nAur please ye mat soch ki tera dil mujhe abhi pura nahi mila to usme koi problem hai.", "platform": "pinterest"}, {"ts": null, "seq": 9845, "sender": "shivraj", "text": "Sach bolun?\nMain chahta bhi nahi ki tu ek din me apna poora dil mujhe de de. Mujhe instant love nahi chahiye. Mujhe real love chahiye. Mujhe woh chahiye jo dheere dheere grow kare. Jisme trust build ho. Jisme tu har din thoda aur comfortable ho. Jisme ek din tujhe khud realize ho ki \"haan, ab ye mera ghar jaisa lagta hai.\" Mujhe tera poora dil forcefully nahi chahiye. Mujhe woh naturally chahiye. Aur jitna time lage, lage. Main race nahi laga raha.", "platform": "pinterest"}, {"ts": null, "seq": 9846, "sender": "shivraj", "text": "Aur ek baat aur.\nPlease kabhi ye mat sochna ki tu meri happiness ki sole responsibility hai. Haan, tu meri life ka bohot important part hai. Haan, agar tu chali gayi to bohot hurt hoga. Lekin main apni zindagi sirf isliye nahi jeeta ki kahin tu na chali jaaye. Main tujhe isliye choose karta hoon kyunki main tere saath rehna chahta hoon, na ki isliye kyunki mujhe tujhe guilt me baandh ke rakhna hai.\nTu baar baar bol rahi thi na, \"tu bohot pure hai.\"", "platform": "pinterest"}, {"ts": null, "seq": 9847, "sender": "shivraj", "text": "Nahi.\nMain bhi insaan hoon. Main insecure hota hoon. Main overthink karta hoon. Main jealous bhi ho sakta hoon. Main hurt bhi hota hoon. Bas difference itna hai ki jab maine tujhe choose kiya hai, to main har problem se bhaagne ke bajaye uske saath baith ke solve karna chahta hoon.\nAur agar kabhi future me tere mind me genuinely kisi aur ke liye feelings aani shuru ho jaaye... please mujhe duniya ka last insaan mat bana dena jisko pata chale. Mere saath baithna. Rona ho to rona. Chillana ho to chillana. Confused ho to bolna \"shivraj , mujhe samajh nahi aa raha.\" Hum dono milke us situation ko face karenge. Ho sakta hai woh sirf ek phase ho. Ho sakta hai woh attraction ho. Ho sakta hai woh kuch aur ho. Lekin hum usse bhaagenge nahi. Break lena sirf isliye ki feelings ko lock kar diya jaaye... shayad usse zyada confusion hi paida hogi. Main chahta hoon pehle hum baat karein. Har baar. Communication pehle. Decision baad me.", "platform": "pinterest"}, {"ts": null, "seq": 9848, "sender": "shivraj", "text": "Aur sun...\nTu bol rahi thi na ki \"Shut out na kar dena.\"\nJis ladki ne mujhe itna comfortable feel karaya hai ki main apni har insecurities baat usse share kar sakta hoon... usko main bina baat kiye kaise shut out kar dunga? Gussa ho sakta hoon. Hurt ho sakta hoon. Thoda space maang sakta hoon. Lekin tujhe ignore karke punish karna? Nahi. Woh mera tareeka nahi hai. Agar kabhi main chup bhi hua, to sirf isliye kyunki mujhe apne emotions samajhne honge. Na ki isliye kyunki tu meri life se erase ho gayi.\nAur finally...", "platform": "pinterest"}, {"ts": null, "seq": 9849, "sender": "shivraj", "text": "Main future predict nahi kar sakta. Na tu kar sakti hai.\nBas itna promise kar sakta hoon.\nJab tak hum dono ek dusre se sach bolte rahenge... tab tak hum kisi bhi problem se lad sakte hain.\nAur agar kabhi woh din aaya bhi jiska tu itna darr leke baithi hai... to us din bhi main ye nahi sochunga ki \"meri saari memories fake thi.\" Main bas ye sochunga ki ek waqt tha jab Chinmayi mujhe itna trust karti thi ki apna sabse bada darr bhi mere paas le aayi thi.\nAur mere liye... woh kabhi jhooth nahi hoga.", "platform": "pinterest"}, {"ts": null, "seq": 9850, "sender": "shivraj", "text": "Isliye abhi ke liye ek kaam kar.\nFuture ke us imaginary dard ko aaj ki khushi kharab mat karne de.\nTu yahin hai. Main yahin hoon. Aur aaj ke din, bas itna hi kaafi hai.", "platform": "pinterest"}, {"ts": null, "seq": 9933, "sender": "shivraj", "text": "Aur ek cheez, jo shayad maine kabhi itni clearly boli nahi.\n\nJab main is situation ko apne POV se sochta hoon na, sach kahun to mujhe kisi aur ka khayal hi nahi aata. Main intentionally ye prove nahi kar raha ki \"dekho main kitna loyal hoon,\" bas meri reality hi aisi hai. Mere dimaag me future imagine hota hai to usme tu hoti hai. Kisi aur ki jagah sochne ki bhi koshish karta hoon to mind blank ho jaata hai. Shayad isliye nahi ki duniya me koi aur achha nahi ho sakta, balki isliye kyunki maine apna dil already ek jagah invest kar diya hai. Aur jab dil kisi ko apna maan leta hai na, to baaki log bas log hi lagte hain. Isliye jab tu apne fears batati hai, main tujhe judge nahi karta. Bas itna sochta hoon ki kaash tu khud ko meri nazron se ek baar dekh paati. Shayad tab tujhe samajh aata ki mujhe kisi aur ke baare me sochne ki zarurat hi mehsoos nahi hoti.", "platform": "pinterest"}, {"ts": null, "seq": 10092, "sender": "shivraj", "text": "mein 11:20 pe nikla , mammi bolti chaata leke ja , mein bola kya ho jaega , mein sirf pen aur paani lekar jaata , aate time hui baarish aur bheeg gaya lol", "platform": "pinterest"}, {"ts": null, "seq": 10332, "sender": "chinmayi", "text": "Like mene dekha, jab me vo exam Dene gayi thi, to pehli shift me, ek lady teacher thi, she was somewhat 8 months pregnant...\nBhyi....\nBall ban jaaa pet poora ke pooraaaa", "platform": "pinterest"}, {"ts": null, "seq": 10854, "sender": "chinmayi", "text": "Aur yaar, jab bada hoga, sufficient banna, financially independent banna\nMummy ko gifts dena, papa ko ghumana...\nBalla ko uske dreams persue krne me support krnaaa", "platform": "pinterest"}, {"ts": null, "seq": 11010, "sender": "shivraj", " ky comments leave you in..\nNo one to depend on, no one to talk about, all the thoughts mingling with each other...", "platform": "pinterest"}, {"ts": null, "seq": 11032, "sender": "chinmayi", "text": "And remember,\nOpening up, doesn't mean, ki you are becoming a burden for me or whatever...\nNeverrr EVERR will these thoughts of your become a burden on me...\nGet that shit into your mind.\nTu mera dhyaan rkhta itna to mera itna to Banta he, ki me tujhe itna comfortable to kr sku, ki kam se kam tu kuchh batane me hesitate naa kre..", "platform": "pinterest"}, {"ts": null, "seq": 11929, "sender": "shivraj", "text": "I do not think that I have ever said this right, but whenever we talk, I always wish inside myself that you should end the conversation in a happier state than when you started. It does not matter whether you are under stress, irritated, tired or just in a funny mood.I don't care whether it is caused by me or anyone else. When I can at least make you smile, tease you and make you roll your eyes or just keep you distracted for some minutes, I feel genuinely happy doing it. I am not trying to do it out of obligation; rather, I am trying to do it because I care for you because you do care for me as far as I'm aware", "platform": "pinterest"}, {"ts": null, "seq": 12036, "sender": "shivraj", "text": "to aate time mammi ka call aaya patty le aana 4 , to unhone 100 rs bheje , mene mein gaya lene , voh bolta 5rs badh gaya price, mere 20 rs ka reserve rehta , voh us din khatam ho gae", "platform": "pinterest"}, {"ts": null, "seq": 13303, "sender": "chinmayi", "text": "Dekh.\nLower abdomen jo hote na, uske just neeche\nVagina hoti na? \nUske upar ek fat ki lining hoti he, protective purpose ke liyeee....\nLike aage bacche vacche krne naaa to, us liye", "platform": "pinterest"}, {"ts": null, "seq": 14116, "sender": "shivraj", "text": "trends se nikalne ke baad miniso gae , udhar grogu ka ek mast sa toy dikha , bohottt manato ke baad maane papa , fir unka card declin  and like mene keh diya, ki in sab kaa bhi chhota he.🙂", "platform": "pinterest"}, {"ts": null, "seq": 15787, "sender": "shivraj", "text": "Umm, main tera, tu meri, tu meri, main tera\nTu meri Heer, sohni, tu meri peer, sohni\nJaan meri hai teri, dil tera hai mera\nTu hi taqdeer, sohni, tu meri ae\nPagal jaise bas tumse pyaar kare", "platform": "pinterest"}, {"ts": null, "seq": 15899, "sender": "shivraj", "text": "i've never asked you to do something, i dont think i ever will in the near future, bas ek choti si request hai... can you reply to my \"love youu\" everytime? i dont know, its just my thingg. if you're not comfortable, then you can just completly ignoree this message. i genuinely dont want you to feel forced.\n\nits not because i need validation all the time, ya fir mujhe baar baar reassurance chahiye. bilkul nahi. its just... jab bhi mai \"love youu\" bolta hu na, it isnt just another text for me. uske saath thoda sa dil bhi bhej deta hu. and jab uska reply aata hai, pata nahi kyu, but ek ajeeb sa feeling milti hai. it feels like, \"haan, ye feeling sirf meri taraf se nahi hai.\"", "platform": "pinterest"}, {"ts": null, "seq": 15900, "sender": "shivraj", "text": "mai generally kisi se kuch maangta hi nahi hu. i always feel ki log jitna de rahe hain, utna hi kaafi hai. isliye ye message bhi likhne se pehle kitni baar socha tha ki bheju ya nahi. kahi tumhe lage ki im being needy ya fir sympathy lene ki koshish kar raha hu. but phir laga, agar tumse bhi honestly nahi bol paunga, toh phir kis se bolunga?\n\nhar baar jab mai \"love youu\" bolta hu na, uske peeche koi reason hota hai. kabhi tumhari kisi baat ne pura din better bana diya hota hai. kabhi tum bina realise kiye meri overthinking ko shant kar deti ho. kabhi bas randomly tum yaad aa jati ho aur mann karta hai bol du. mere liye wo words kabhi habit nahi bane, unka meaning har baar same rehta hai.", "platform": "pinterest"}, {"ts": null, "seq": 15901, "sender": "shivraj", "text": "i know everyone expresses affection differently. kisi ke liye ye words bahut easy hote hain, kisi ke liye nahi. and trust me, i respect that. mai kabhi nahi chahta ki tum sirf meri wajah se apna comfort compromise karo. isliye agar kabhi bhi uncomfortable feel ho, bas ignore kar dena. i promise i wont take it the wrong way. mujhe fake response se zyada tumhari genuine comfort matter karti hai.\n\nbas... jab tum reply karti ho na, even if its just \"love you too\", you have no idea kitna stupid sa smile aa jata hai face pe. i end up reading that message again later. kabhi kabhi bina reason ke chat khol ke dekh leta hu. sounds wierd i know... but thats literally what happens.", "platform": "pinterest"}, {"ts": null, "seq": 15902, "sender": "shivraj", "text": "aur tumhari ek aur problem hai... tumhe shayad khud nahi pata tumhari baaton ka mujhpe kitna effect hota hai. ek chota sa text bhi pura mood change kar deta hai. kaafi unfair system hai honestly. insaan poora din survive kar leta hai, aur phir ek notification aati hai teri.. aur dimag decide kar leta hai ki \"haan, ab khush hona hai.\"\n\nso this isnt me expecting anything from you. ye koi rule nahi hai, na hi koi promise maang raha hu. bas ek choti si wish hai... because those replies stay with me longer than you probably realise. and if someday you dont reply, i promise i wont stop saying \"love youu.\" kyuki wo words mai kisi reply ke liye nahi bolta. mai isliye bolta hu because i genuinely mean them. bas... jab tum unka jawab deti ho na, it somehow makes my heart feel a little more at home.", "platform": "pinterest"}, {"ts": null, "seq": 16262, "sender": "shivraj", "text": "ek to ek baar mri hua tha mera , 1 hour tak fat gai thi next level , pure time to ese nikaal raha tha ki like i'll press the buzzer the next second , thankfully i did't but the thought kept me alive ,nikla to kuch tha nahi mri mein , time waste tha", "platform": "pinterest"}, {"ts": null, "seq": 16273, "sender": "shivraj", "text": "aur ek to yeh soch ke fat ja mne strong dikhne ke liye.\n\nAb thoda rest kar,", "platform": "pinterest"}, {"ts": null, "seq": 24169, "sender": "chinmayi", "text": "Kuchh hua he aajjj???\nYe pehle ki koi memory haunt kr rhiii???\nSeee....\nTeri galti he?\nNahi he naa??\nMera to he bhi nahi, uske baavjood bhi kr diya logo ne🙂\nIt isn't your mistake that you get tremors,,, \n(Zyaada tension nahi leni isiliyeeee)\nMe ye nahi keh rhi, ki yk, enjoy it or whatever.,, if I were in your place, I too would've doubted on myself about doing anything different...", "platform": "pinterest"}, {"ts": null, "seq": 24171, "sender": "chinmayi", "text": "Aur har baar ki tareh, is baar bhi, NOT SYMPATHISINGGG\nAnd you telling me about it, won't make you a pick me, nor would it burder me a bit,,,\nKeep that into your mind Mr, shiv.", "platform": "pinterest"}, {"ts": null, "seq": 24178, "sender": "shivraj", "text": "dekh  , mera yeh darna bhi parkinson se hi releated hai , to yeh sab log maje lete peeche se kande pe randomly haath rakh ke , i just dont fckin like it", "platform": "pinterest"}, {"ts": null, "seq": 24899, "sender": "shivraj", "text": "i know you're currently sleeping and you'll read this after coming back from school. i dont actually know what happened, why was your mood ruined. if this was because of me, i genuinely won't forgive myself in this century. but if something else is the reason, then i just hope, with all my heart, that whatever it is becomes a little lighter by the time you read this.", "platform": "pinterest"}, {"ts": null, "seq": 24900, "sender": "shivraj", "text": "i don't know the reason behind that \"Mere hi mood ke 12 baje padei\" text, and maybe you don't even feel like talking about it right now. that's okay. i don't want to force you to explain anything. i just wanted to remind you that you don't have to carry every single thing alone. sometimes you become so strong for everyone around you that people forget even the strongest people get tired too. and if today is one of those days where you're just exhausted mentally, emotionally, or even for no reason at all, then i really wish i could take even a tiny bit of that weight away from you.", "platform": "pinterest"}, {"ts": null, "seq": 24901, "sender": "shivraj", "text": "it genuinely hurts me seeing you like this. not because i think i have to \"fix\" everything, but because you're someone who unknowingly makes my days so much brighter. you bully me, every other minute, make fun of me whenever i get shy, and somehow all of that has become such a normal and beautiful part of my day that imagining you sitting there with a heavy heart just feels... wrong. duniya already itni weird hai, usme bhi agar tu udaas ho jaaye, toh system hi galat chal raha hai.", "platform": "pinterest"}, {"ts": null, "seq": 24902, "sender": "shivraj", "text": "it genuinely hurts me seeing you like this. not because i think i have to \"fix\" everything, but because you're someone who unknowingly makes my days so much brighter. you bully me, every other minute, make fun of me whenever i get shy, and somehow all of that has become such a normal and beautiful part of my day that imagining you sitting there with a heavy heart just feels... wrong. duniya already itni weird hai, usme bhi agar tu udaas ho jaaye, toh system hi galat chal raha hai.", "platform": "pinterest"}, {"ts": null, "seq": 24904, "sender": "shivraj", "text": "i know you usually try to laugh things off. sometimes you change the topic, sometimes you act like nothing happened, and sometimes you just say \"it's okay\" even when i know it probably isn't. i don't know if today is one of those days, but if it is, then please don't convince yourself that your feelings are \"too much\" or that you'll become a burden by talking about them. you'll never be a burden to me. never.", "platform": "pinterest"}, {"ts": null, "seq": 24905, "sender": "shivraj", "text": "and if, by even the smallest chance, i am the reason behind your mood... i'm really sorry. maybe i said something stupid without realising, maybe i missed something i should've noticed, maybe i wasn't there when i should've been. i honestly don't know. but i do know this, hurting you is one of the last things i'd ever want to do. i'd rather sit there than be the reason behind that silence or sadness.", "platform": "pinterest"}, {"ts": null, "seq": 24906, "sender": "shivraj", "text": "i wish i had one of those magical buttons that could instantly transfer sadness from one person to another. trust me, i'd spam that thing without thinking twice. because seeing you smile, seeing your random messages, your tiny little habits... they matter to me more than you'll probably ever realise. and maybe i don't always say it properly, but they genuinely make my day.", "platform": "pinterest"}, {"ts": null, "seq": 24907, "sender": "shivraj", "text": "please don't pressure yourself to reply with a huge explanation when you come back from school. if you don't want to talk about it, that's completely okay. if you just want someone to sit there while you complain about life, i'm here. if you want distractions, i'll happily embarrass myself trying to make you laugh. if you want silence, i'll respect that too. i don't need to know every detail to care about you.", "platform": "pinterest"}, {"ts": null, "seq": 24908, "sender": "shivraj", "text": "just promise me one thing. don't let yourself believe that you're alone while dealing with whatever this is. because you're not. maybe i can't solve every problem in your life, maybe i can't magically make everything disappear, but i'll always be here, hoping tomorrow treats you kinder than today did.", "platform": "pinterest"}, {"ts": null, "seq": 24909, "sender": "shivraj", "text": "and before you roll your eyes after reading all this and call me dramatic... maybe i am. but only because someone as precious as you deserves to be reminded that she's cared about. so when you read this, i hope your day has already become a little better. and if it hasn't... then i hope this message at least makes you smile for a second.", "platform": "pinterest"}, {"ts": null, "seq": 24935, "sender": "chinmayi", "text": "Vo to, thoda tha, ki tera sar dard kr rha tha, to tere reply vhi chhote chhote ho rkhe the...\nBut that vanished the moment you told me you had headache", "platform": "pinterest"}, {"ts": null, "seq": 25764, "sender": "shivraj", "text": "insta pe mene ek photo bheji , yeh photo mene shubham sarthak ko bheji aur bola , jitne logo ko jaante sabko forwards karne ko boldiya , then 15-20 bando ne vighnesh ko ese bday wish kiya", "platform": "pinterest"}, {"ts": null, "seq": 26002, "sender": "shivraj", "text": "I do ,sometimes I just don't know how to channel my emotions and thoughts to words but I just wanna see you happy every second.It genuinely hurts me when I can't uplift your mood", "platform": "pinterest"}, {"ts": null, "seq": 26333, "sender": "shivraj", "text": "Ek baar contraceptive explain karne ke liye kehti pehle hi baache thodi karoge ,pehle *** life enjoy hoga ,ek din kehti ki apne partner ki dates pata honi chahiye", "platform": "pinterest"}, {"ts": null, "seq": 26602, "sender": "shivraj", "text": "i genuinely wish ki main thodi der ke liye hi sahi, ye feeling tumse le paata. Jab tumne bataya na aaj kya hua, bas wahi dimaag mein chal raha tha ki kitna bura laga hoga tumhe woh sunke. Mujhe pata hai ye sirf tab ki baat nahi hai. Ye us comfort ki baat hai jo tumhe usse milta hai, aur jab woh bhi limit hone lage na, toh bahut helpless feel hota hai. Aur ye soch ke ki tum uske baad royi... sach mein mera dil toot gaya.", "platform": "pinterest"}, {"ts": null, "seq": 26603, "sender": "shivraj", "text": "Mujhe pata hai aunty aur uncle ye sab isliye nahi kar rahe kyunki woh tumse pyaar nahi karte. Unhe bas lagta hoga ki woh jo kar rahe hain, woh tumhare liye sahi hai. Par iska matlab ye bilkul nahi ki tumhare emotions galat hain. Agar tum sad ho, frustrated ho ya bas thak gayi ho sabse, toh that's completely okay.", "platform": "pinterest"}, {"ts": null, "seq": 26604, "sender": "shivraj", "text": "Bas ek baat yaad rakhna... please kabhi ye mat sochna ki tum isme akeli ho. Agar hum kam baat kar payenge, replies late aayenge, ya sirf 10-15 minute hi milenge, tab bhi main kahin nahi jaa raha. Main utni der ka bhi wait happily karunga, kyunki mere liye important ye nahi hai ki hum kitni der baat karte hain... important ye hai ki baat tumse hoti hai.", "platform": "pinterest"}, {"ts": null, "seq": 26605, "sender": "shivraj", "text": "Aur please... aise akele mat roya karo, chinmayi. Kaash main wahan hota aur bas ek hug deke bol pata ki sab theek ho jayega. Shayad abhi main physically tumhare paas nahi hoon, par emotionally hamesha rahunga. Jab bhi tumhe lage ki sab kuch bahut zyada ho raha hai, bas yaad rakhna ki ek insaan hai jo tumhari har chhoti si baat ki care karta hai, jo tumhare 15 minute bhi poore din jitne precious maanta hai. I love youu, aur mujhe bas itna chahiye ki tum khud pe itni sakhti mat karo. Tum already bahut strong ho, chahe tumhe khud abhi woh dikh na raha ho.", "platform": "pinterest"}, {"ts": null, "seq": 26653, "sender": "shivraj", "text": "aur pw to dehradun hai center , aaj tak ek baar nahi gaya litreally 🤣🤣🤣, shirt bhi dehradun mein kahi aur se mile , matlab physicaly center mein aaj tak nahi gaya", "platform": "pinterest"}, {"ts": null, "seq": 26837, "sender": "chinmayi", "text": "Aur dekh\nAnxiety hoti hee\nSabke apne apne levels hote jhelne keee\nMujhe bhu kabhi kabhar peak kr jaati he, aur Esa lagta, ki sab dissappear ho jaye bs hamesha ke liyee", "platform": "pinterest"}, {"ts": null, "seq": 26975, "sender": "chinmayi", "text": "\"Me merk ek dost ki baat bhej rhi thi ham teeno ke group me but ye wala grp pe click ho gya glti se, aur ohir kafi absurd sa tha msg to mene leave kr diya, kyunki mujhe lga aapne dekh liya sir\"", "platform": "pinterest"}, {"ts": null, "seq": 27009, "sender": "chinmayi", "text": "Vo jo group pe mera msg tha na, vo mujh ng as my heart remembers how to beat, I will continue to choose you.", "platform": "pinterest"}, {"ts": null, "seq": 28709, "sender": "shivraj", "text": "Meri baat sun, pehli baat to jab tu offline hoti hai na, mera dimaag net gaya hoga pe hi settle ho jata hai. Itna panic nahi karta jitna tu soch rhi hai. 😭\n\nAur dusri baat, jo bhi time main tujhe deta hoon na, woh sacrifice nahi hai. Sacrifice tab hota hai jab insaan majboori me kuch chhodta hai. Main tujhe time deta hoon kyunki mujhe accha lagta hai, meri choice hai. Iska guilt mat le.", "platform": "pinterest"}, {"ts": null, "seq": 28710, "sender": "shivraj", "text": "Aur meri padhai, mera selection... uski responsibility sirf meri hai.Tu meri motivation hai, distraction nahi. Main balance karna seekh chuka hun , tu bas ye mat soch ki tu meri life kharab kar rhi hai.\n\nBas ek promise kar, itna overthink mat kiya kar aur apne aap ko har cheez ke liye guilty mat maana kar. Mujhe tu chahiye, tera guilt nahi.", "platform": "pinterest"}, {"ts": null, "seq": 28754, "sender": "shivraj", "text": "When we hold each other, in the darkness, it doesn't make the darkness go away. The bad things are still out there. The nightmares still walking. When we hold each other we feel not safe, but better. \"It's all right\" we whisper, \"I'm here, I love you.\" and we lie: \"I'll never leave you.\" For just a moment or two the darkness doesn't seem so bad.", "platform": "pinterest"}, {"ts": null, "seq": 29020, "sender": "shivraj", "text": ",For your laugh,your voice ,your eyes ,your hair and above all your sweet ever surprising mind which is an enchanting quarry in which it is my privilege to delve\"", "platform": "pinterest"}, {"ts": null, "seq": 29558, "sender": "shivraj", "text": "Babygurll please ek baar meri baat dhyaan se sunna . Mujhe pata hai marks dekh ke bura lag raha hoga, especially jab tune genuinely apna best diya tha. But please apne aap ko sirf ek test ke marks se judge mat karna. Marks bas ye batate hain ki aaj , const VIOLET = "#6C5CE7";
const PINK = "#FF4FA0";
const MINT = "#2FD9A8";

function fmtNum(n) {
  return n.toLocaleString("en-US");
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}

function useInView(threshold = 0.2) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) setInView(true);
      },
      { threshold }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, inView];
}

function CountUp({ target, duration = 1400, format = fmtNum }) {
  const [ref, inView] = useInView(0.4);
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!inView) return;
    let start = null;
    let raf;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min(1, (ts - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.floor(eased * target));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [inView, target, duration]);
  return <span ref={ref}>{format(val)}</span>;
}

function Reveal({ children, delay = 0 }) {
  const [ref, inView] = useInView(0.15);
  return (
    <div
      ref={ref}
      style={{
        opacity: inView ? 1 : 0,
        transform: inView ? "translateY(0)" : "translateY(18px)",
        transition: `opacity 0.7s ease ${delay}ms, transform 0.7s ease ${delay}ms`,
      }}
    >
      {children}
    </div>
  );
}

function Stitch() {
  return (
    <div
      aria-hidden="true"
      style={{
        display: "flex", alignItems: "center", justifyContent: "center",
        gap: 10, margin: "0 auto", maxWidth: 640, padding: "8px 0",
      }}
    >
      {Array.from({ length: 18 }).map((_, i) => (
        <span
          key={i}
          style={{
            width: 5, height: 5, borderRadius: 999,
            background: i % 3 === 0 ? PINK : i % 3 === 1 ? VIOLET : GOLD,
            opacity: 0.55,
          }}
        />
      ))}
    </div>
  );
}

function Eyebrow({ children, color = PINK }) {
  return (
    <div
      style={{
        fontFamily: "'Space Mono', monospace",
        fontSize: 12.5,
        letterSpacing: "0.18em",
        textTransform: "uppercase",
        color,
        fontWeight: 700,
        marginBottom: 10,
        display: "flex", alignItems: "center", gap: 8,
      }}
    >
      <span style={{ width: 22, height: 2, background: color, display: "inline-block", borderRadius: 2 }} />
      {children}
    </div>
  );
}

function Bubble({ children, tail = "left", color = "#fff", rot = 0, style = {} }) {
  return (
    <div
      style={{
        background: color,
        borderRadius: 26,
        borderBottomLeftRadius: tail === "left" ? 6 : 26,
        borderBottomRightRadius: tail === "right" ? 6 : 26,
        boxShadow: "0 8px 24px -12px rgba(108,92,231,0.25), 0 2px 8px -2px rgba(255,79,160,0.12)",
        padding: "22px 24px",
        transform: rot ? `rotate(${rot}deg)` : undefined,
        border: "1px solid rgba(43,27,51,0.05)",
        ...style,
      }}
    >
      {children}
    </div>
  );
}

const CustomTooltip = ({ active, payload, label }) => {
  if (!active || !payload || !payload.length) return null;
  return (
    <div
      style={{
        background: INK, color: CREAM, padding: "10px 14px", borderRadius: 14,
        fontFamily: "'Plus Jakarta Sans', sans-serif", fontSize: 13,
        boxShadow: "0 12px 24px -8px rgba(0,0,0,0.4)",
      }}
    >
      <div style={{ fontWeight: 700, marginBottom: 4 }}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} style={{ color: p.color, display: "flex", justifyContent: "space-between", gap: 16 }}>
          <span>{p.name}</span>
          <span style={{ fontFamily: "'Space Mono', monospace" }}>{fmtNum(p.value)}</span>
        </div>
      ))}
    </div>
  );
};

function fmtLetterDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) +
    " · " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

const PLATFORM_COLOR = { whatsapp: MINT, instagram: VIOLET, pinterest: PINK };
const PLATFORM_LABEL = { whatsapp: "WhatsApp", instagram: "Instagram", pinterest: "Pinterest" };

function LettersSection() {
  const [person, setPerson] = useState("chinmayi");
  const [visible, setVisible] = useState(20);
  const list = LETTERS.filter((l) => l.sender === person).sort((a, b) => {
    if (!a.ts && !b.ts) return a.seq - b.seq;
    if (!a.ts && b.ts) return -1;
    if (a.ts && !b.ts) return 1;
    return a.ts.localeCompare(b.ts);
  });
  const shown = list.slice(0, visible);

  const personInfo = {
    chinmayi: { name: "Chinmayi", color: PINK, tail: "left" },
    shivraj: { name: "Shivraj", color: VIOLET, tail: "right" },
  }[person];

  return (
    <section style={{ maxWidth: 760, margin: "0 auto", padding: "20px 20px 100px" }}>
      <Reveal>
        <Eyebrow color={GOLD}>chapter seven — the long messages</Eyebrow>
        <h2 className="disp" style={{ fontSize: "clamp(26px, 4vw, 38px)", margin: "0 0 8px" }}>
          every paragraph, by person
        </h2>
        <p style={{ color: "#5C4D63", fontSize: 15, marginBottom: 26, maxWidth: 560 }}>
          Every genuinely long message (150+ characters) either of you has written
          across WhatsApp, Instagram, and Pinterest. Pinterest paragraphs come first (in the
          order they were actually sent, though its export has no exact timestamps), followed by
          WhatsApp/Instagram messages, which are dated exactly.
        </p>
      </Reveal>

      <Reveal delay={80}>
        <div
          style={{
            display: "inline-flex", padding: 5, borderRadius: 999, background: "#F1EAF1",
            marginBottom: 26, gap: 4,
          }}
        >
          {["chinmayi", "shivraj"].map((p) => {
            const info = { chinmayi: { name: "Chinmayi", color: PINK }, shivraj: { name: "Shivraj", color: VIOLET } }[p];
            const active = person === p;
            return (
              <button
                key={p}
                onClick={() => { setPerson(p); setVisible(20); }}
                style={{
                  border: "none", cursor: "pointer", padding: "10px 22px", borderRadius: 999,
                  fontFamily: "'Plus Jakarta Sans', sans-serif", fontWeight: 700, fontSize: 14.5,
                  background: active ? info.color : "transparent",
                  color: active ? "#fff" : "#5C4D63",
                  transition: "all 0.25s ease",
                }}
              >
                {info.name}
              </button>
            );
          })}
        </div>
      </Reveal>

      <Reveal delay={120}>
        <div className="mono" style={{ fontSize: 12.5, color: "#8A7A90", marginBottom: 16 }}>
          {list.length} long messages from {personInfo.name}
        </div>
      </Reveal>

      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        {shown.map((l, i) => (
          <Reveal key={(l.ts || `pin-${l.seq}`) + i} delay={Math.min(i, 6) * 40}>
            <Bubble color="#fff" tail={personInfo.tail} style={{ borderLeft: `3px solid ${personInfo.color}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
                <span className="mono" style={{ fontSize: 12, color: "#8A7A90" }}>
                  {l.ts ? fmtLetterDate(l.ts) : ""}
                </span>
                <span
                  style={{
                    fontSize: 11, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase",
                    color: PLATFORM_COLOR[l.platform], background: PLATFORM_COLOR[l.platform] + "1A",
                    padding: "3px 10px", borderRadius: 999,
                  }}
                >
                  {PLATFORM_LABEL[l.platform]}
                </span>
              </div>
              <div style={{ fontSize: 15, lineHeight: 1.65, whiteSpace: "pre-wrap", color: INK }}>
                {l.text}
              </div>
            </Bubble>
          </Reveal>
        ))}
      </div>

      {visible < list.length && (
        <div style={{ textAlign: "center", marginTop: 26 }}>
          <button
            onClick={() => setVisible((v) => v + 20)}
            style={{
              border: `2px solid ${personInfo.color}`, background: "#fff", color: personInfo.color,
              fontWeight: 700, fontSize: 14.5, padding: "12px 28px", borderRadius: 999,
              cursor: "pointer", fontFamily: "'Plus Jakarta Sans', sans-serif",
            }}
          >
            Show {Math.min(20, list.length - visible)} more
          </button>
        </div>
      )}
    </section>
  );
}

          ].map((s, i) => (
            <Reveal key={i} delay={(i + 1) * 90}>

              <div className="hand" style={{ fontSize: 21, color: "#5C4D63", marginTop: 2, lineHeight: 1.3 }}>

          </div>

                  <div style={{ fontWeight: 700, fontSize: 14.5, marginBottom: 14 }}>{row.label}</div>
                  {[{ n: "Shivraj", v: row.a, c: VIOLET }, { n: "Chinmayi", v: row.b, c: PINK }].map((x, j) => (
                    <div key={j} style={{ marginBottom: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4, color: "#5C4D63" }}>
                        <span>{x.n}</span><span className="mono">{x.v}</span>
                      </div>
                      <div style={{ height: 8, borderRadius: 999, background: "#F1EAF1", overflow: "hidden" }}>
                        <div style={{ width: `${(x.v / max) * 100}%`, height: "100%", background: x.c, borderRadius: 999 }} />

            <Bubble color="#fff" tail="left" rot={-0.7} style={{ height: "100%" }}>
              <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 16, color: "#8A7A90" }}>TOP WORDS</div>

                <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 9 }}>

                    <div
                      style={{
                        width: `${(w.count / maxWord) * 100}%`, height: "100%", borderRadius: 999,
                        background: `linear-gradient(90deg, ${VIOLET}, ${PINK})`,

                    />
                  </div>
                  <div className="mono" style={{ fontSize: 11.5, color: "#8A7A90", width: 40, textAlign: "right" }}>{w.count}</div>

            </Bubble>
          </Reveal>
          <Reveal delay={100}>
            <Bubble color="#fff" tail="right" rot={0.7} style={{ height: "100%" }}>

              <div style={{ display: "flex", flexWrap: "wrap", gap: 16, alignItems: "center", justifyContent: "center", padding: "8px 0" }}>
                {DATA.topEmojis.map((e, i) => {

                    <div key={i} style={{ textAlign: "center", transform: `rotate(${tilt}deg)` }}>
                      <div style={{ fontSize: size, lineHeight: 1, filter: "drop-shadow(0 3px 4px rgba(43,27,51,0.12))" }}>{e.emoji}</div>
                      <div className="mono" style={{ fontSize: 10.5, color: "#8A7A90", marginTop: 4 }}>{fmtNum(e.count)}</div>

            </Bubble>
          </Reveal>
        </div>

                  <XAxis dataKey="hour" tick={{ fontSize: 10, fill: "#8A7A90" }} axisLine={false} tickLine={false} interval={2} />

                </AreaChart>
              </ResponsiveContainer>
              <div style={{ fontSize: 12.5, color: "#8A7A90", marginTop: 6 }}>Peak talking hours: 10pm – 1am 🌙</div>
            </Bubble>
          </Reveal>
          <Reveal delay={100}>
            <Bubble color="#fff" tail="right" rot={0.6}>

                  <YAxis tick={{ fontSize: 10, fill: "#8A7A90" }} axisLine={false} tickLine={false} />
                  <Tooltip content={<CustomTooltip />} />
                  <Bar dataKey="count" name="Messages" radius={[8, 8, 0, 0]}>
                    {DATA.dowData.map((d, i) => (
                      <Cell key={i} fill={d.day === "Wed" ? PINK : VIOLET} fillOpacity={d.day === "Wed" ? 1 : 0.55} />
                    ))}

                </BarChart>
              </ResponsiveContainer>
              <div style={{ fontSize: 12.5, color: "#8A7A90", marginTop: 6 }}>Wednesdays win, every time 🎀</div>

      {/* PHOTOS */}
      <section style={{ maxWidth: 1040, margin: "0 auto", padding: "20px 20px 90px" }}>
        <Reveal>
          <Eyebrow color={PINK}>chapter six — us, in pictures</Eyebrow>
          <h2 className="disp" style={{ fontSize: "clamp(26px, 4vw, 38px)", margin: "0 0 8px" }}>
            the photo wall
          </h2>
          <p style={{ color: "#5C4D63", fontSize: 15, marginBottom: 26, maxWidth: 560 }}>
            A few taped-in polaroids, because the numbers only tell half the story.
          </p>
        </Reveal>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 26 }}>
          {PHOTOS.map((p, i) => (
            <Reveal key={i} delay={i * 90}>
              <div

                  background: "#fff", borderRadius: 4, padding: "10px 10px 16px",

                <div className="hand" style={{ fontSize: 18, color: "#5C4D63", textAlign: "center", marginTop: 8 }}>
                  {p.caption}
                </div>

      {/* LETTERS */}
      <LettersSection />

      {/* FOOTER */}
      <section style={{ textAlign: "center", padding: "40px 20px 90px" }}>
        <Reveal>
          <div style={{ fontSize: 30, marginBottom: 10 }}>🎀</div>
          <div className="disp" style={{ fontSize: 22, fontWeight: 600 }}>that's the whole tally</div>
          <p className="mono" style={{ fontSize: 12, color: "#8A7A90", marginTop: 10, letterSpacing: "0.05em" }}>
            {fmtNum(DATA.totalMessages)} MESSAGES · {totalDays} DAYS · 3 APPS · 1 CONVERSATION
          </p>
        </Reveal>
      </section>
    </div>
  );
}
